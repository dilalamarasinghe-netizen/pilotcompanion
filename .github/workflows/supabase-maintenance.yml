name: Pilot Companion Supabase Maintenance

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

jobs:
  maintenance:
    name: Database Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Run Supabase Maintenance
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          KEEPALIVE_SECRET: ${{ secrets.KEEPALIVE_SECRET }}

        run: |
          curl --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            --retry-delay 5 \
            -X POST \
            "${SUPABASE_URL}/functions/v1/pilot-companion-maintenance" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "x-pc-maintenance-secret: ${KEEPALIVE_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}'
